<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Club Discount - 東京クラブゲストディスカウント検索</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">Tokyo Club Discount</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-view="search">検索</button>
        <button class="nav-btn" data-view="favorites">お気に入り</button>
        <button class="nav-btn" data-view="guestlist">ゲストリスト登録</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">東京ナイトクラブの<br>ゲストディスカウントを検索</h1>
      <p class="hero-sub">クラブオーナー・スタッフ向け｜ゲストリスト・割引情報を一括管理</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="クラブ名・エリア・ジャンルで検索...">
        <button id="searchBtn" class="btn-primary">検索</button>
      </div>
    </div>
  </section>

  <main class="main">
    <section id="view-search" class="view active">
      <div class="filters">
        <select id="filterArea" class="filter-select">
          <option value="">エリア：すべて</option>
        </select>
        <select id="filterGenre" class="filter-select">
          <option value="">ジャンル：すべて</option>
        </select>
        <select id="filterDiscount" class="filter-select">
          <option value="">割引タイプ：すべて</option>
          <option value="ゲストリスト">ゲストリスト</option>
          <option value="女性割引">女性割引</option>
          <option value="早割">早割</option>
          <option value="グループ割">グループ割</option>
          <option value="カップル割">カップル割</option>
          <option value="誕生日特典">誕生日特典</option>
        </select>
      </div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="clubs-grid" id="clubsGrid"></div>
    </section>

    <section id="view-favorites" class="view">
      <h2 class="view-title">お気に入りクラブ</h2>
      <div id="favoritesGrid" class="clubs-grid">
        <div class="empty-state">
          <span class="empty-icon">⭐</span>
          <p>お気に入りはまだありません</p>
          <p class="empty-sub">クラブカードの ⭐ をタップして追加しましょう</p>
        </div>
      </div>
    </section>

    <section id="view-guestlist" class="view">
      <h2 class="view-title">ゲストリスト登録</h2>
      <div class="form-container">
        <form id="guestlistForm" class="form">
          <div class="form-group">
            <label>クラブを選択 <span class="required">*</span></label>
            <select id="glClub" required>
              <option value="">選択してください</option>
            </select>
          </div>
          <div class="form-group">
            <label>お名前 <span class="required">*</span></label>
            <input type="text" id="glName" placeholder="山田 太郎" required>
          </div>
          <div class="form-group">
            <label>メールアドレス <span class="required">*</span></label>
            <input type="email" id="glEmail" placeholder="email@example.com" required>
          </div>
          <div class="form-group">
            <label>来店予定日</label>
            <input type="date" id="glDate">
          </div>
          <div class="form-group">
            <label>人数</label>
            <select id="glPartySize">
              <option value="1">1名</option>
              <option value="2">2名</option>
              <option value="3">3名</option>
              <option value="4">4名</option>
              <option value="5">5名以上</option>
            </select>
          </div>
          <button type="submit" class="btn-primary btn-full">登録する</button>
        </form>
        <div id="glSuccess" class="success-msg" style="display:none"></div>
      </div>
    </section>
  </main>

  <div id="clubModal" class="modal" style="display:none">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
