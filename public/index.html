<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>転職サーチ - あなたに合った求人を探そう</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f5f7fa; color: #333; }

  /* Header */
  header { background: #1a73e8; color: white; padding: 0 20px; height: 60px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  header h1 { font-size: 1.3rem; white-space: nowrap; }
  header h1 span { font-size: .8rem; font-weight: normal; margin-left: 6px; opacity: .8; }
  .header-search { flex: 1; max-width: 500px; display: flex; }
  .header-search input { flex: 1; padding: 8px 14px; border: none; border-radius: 4px 0 0 4px; font-size: .95rem; outline: none; }
  .header-search button { padding: 8px 16px; background: #fbbc04; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; color: #333; }
  .header-search button:hover { background: #f9a800; }

  /* Layout */
  .container { display: flex; max-width: 1200px; margin: 20px auto; padding: 0 16px; gap: 20px; }

  /* Sidebar */
  aside { width: 240px; flex-shrink: 0; }
  .filter-card { background: white; border-radius: 8px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .filter-card h3 { font-size: .85rem; font-weight: bold; color: #555; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px solid #1a73e8; padding-bottom: 8px; }
  .filter-group { margin-bottom: 18px; }
  .filter-group label { display: block; font-size: .85rem; color: #555; margin-bottom: 6px; font-weight: 600; }
  .filter-group select, .filter-group input[type=text] { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: .88rem; outline: none; }
  .filter-group select:focus, .filter-group input:focus { border-color: #1a73e8; }
  .checkbox-group { display: flex; flex-direction: column; gap: 6px; }
  .checkbox-group label { display: flex; align-items: center; gap: 7px; font-size: .88rem; cursor: pointer; color: #444; }
  .checkbox-group input[type=checkbox] { accent-color: #1a73e8; }
  .salary-display { text-align: center; font-size: .85rem; color: #1a73e8; font-weight: bold; margin-top: 6px; }
  input[type=range] { width: 100%; accent-color: #1a73e8; }
  .btn-search { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: .95rem; cursor: pointer; font-weight: bold; margin-top: 4px; }
  .btn-search:hover { background: #1558b0; }
  .btn-reset { width: 100%; padding: 8px; background: white; color: #666; border: 1px solid #ddd; border-radius: 6px; font-size: .85rem; cursor: pointer; margin-top: 8px; }
  .btn-reset:hover { background: #f5f5f5; }

  /* Main */
  main { flex: 1; min-width: 0; }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .results-count { font-size: .9rem; color: #555; }
  .results-count strong { color: #1a73e8; font-size: 1.1rem; }
  .sort-select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: .88rem; outline: none; }

  /* Job Cards */
  .job-card { background: white; border-radius: 8px; padding: 18px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); border: 1px solid #eee; transition: box-shadow .2s, border-color .2s; cursor: pointer; }
  .job-card:hover { box-shadow: 0 4px 12px rgba(26,115,232,.15); border-color: #1a73e8; }
  .job-title { font-size: 1.05rem; font-weight: bold; color: #1a73e8; margin-bottom: 4px; }
  .job-company { font-size: .9rem; color: #555; margin-bottom: 8px; }
  .job-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .badge { font-size: .78rem; padding: 3px 9px; border-radius: 12px; font-weight: 500; }
  .badge-location { background: #e8f0fe; color: #1a73e8; }
  .badge-type { background: #e6f4ea; color: #137333; }
  .badge-salary { background: #fce8e6; color: #c5221f; font-weight: bold; }
  .badge-exp { background: #fef7e0; color: #8c5f00; }
  .job-desc { font-size: .85rem; color: #666; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
  .job-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tag { font-size: .75rem; padding: 2px 8px; background: #f1f3f4; color: #444; border-radius: 4px; }
  .job-card-footer { display: flex; justify-content: flex-end; }
  .btn-detail { padding: 7px 16px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-size: .85rem; cursor: pointer; }
  .btn-detail:hover { background: #1558b0; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: #888; }
  .empty svg { margin-bottom: 14px; opacity: .4; }
  .empty p { font-size: 1rem; }

  /* Pagination */
  .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
  .pagination button { padding: 7px 12px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-size: .88rem; }
  .pagination button.active { background: #1a73e8; color: white; border-color: #1a73e8; }
  .pagination button:hover:not(.active) { background: #f1f3f4; }
  .pagination button:disabled { opacity: .4; cursor: default; }

  /* Spinner */
  .spinner { display: flex; justify-content: center; align-items: center; padding: 50px; }
  .spinner::after { content: ''; width: 36px; height: 36px; border: 4px solid #e8f0fe; border-top-color: #1a73e8; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: white; border-radius: 10px; max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid #eee; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: white; z-index: 1; }
  .modal-header h2 { font-size: 1.1rem; color: #1a73e8; line-height: 1.4; }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #888; flex-shrink: 0; line-height: 1; }
  .modal-body { padding: 20px 24px 24px; }
  .modal-company { font-size: 1rem; font-weight: bold; margin-bottom: 12px; }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .modal-desc { font-size: .9rem; line-height: 1.8; color: #444; white-space: pre-wrap; margin-bottom: 16px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .btn-apply { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .btn-apply:hover { background: #1558b0; }

  @media (max-width: 700px) {
    .container { flex-direction: column; }
    aside { width: 100%; }
    header h1 span { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>転職サーチ <span>あなたに合った求人を探そう</span></h1>
  <div class="header-search">
    <input type="text" id="headerKeyword" placeholder="職種・会社名・スキルで検索">
    <button onclick="applyHeaderSearch()">検索</button>
  </div>
</header>

<div class="container">
  <aside>
    <div class="filter-card">
      <h3>絞り込み</h3>

      <div class="filter-group">
        <label>キーワード</label>
        <input type="text" id="keyword" placeholder="例: エンジニア, React">
      </div>

      <div class="filter-group">
        <label>勤務地</label>
        <select id="location">
          <option value="">全国</option>
          <option value="東京">東京</option>
          <option value="大阪">大阪</option>
          <option value="名古屋">名古屋</option>
          <option value="福岡">福岡</option>
          <option value="リモート">リモート</option>
        </select>
      </div>

      <div class="filter-group">
        <label>雇用形態</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="fulltime"> 正社員</label>
          <label><input type="checkbox" value="contract"> 契約社員</label>
          <label><input type="checkbox" value="parttime"> パート/アルバイト</label>
        </div>
      </div>

      <div class="filter-group">
        <label>最低年収</label>
        <input type="range" id="salary" min="0" max="1500" step="50" value="0">
        <div class="salary-display" id="salaryDisplay">下限なし</div>
      </div>

      <div class="filter-group">
        <label>経験年数</label>
        <select id="experience">
          <option value="0">不問</option>
          <option value="1">1年以上</option>
          <option value="3">3年以上</option>
          <option value="5">5年以上</option>
        </select>
      </div>

      <button class="btn-search" onclick="search(1)">この条件で検索</button>
      <button class="btn-reset" onclick="resetFilters()">条件をリセット</button>
    </div>
  </aside>

  <main>
    <div class="results-header">
      <div class="results-count" id="resultsCount"></div>
      <select class="sort-select" id="sortSelect" onchange="search(1)">
        <option value="new">新着順</option>
        <option value="salary">年収順（高い順）</option>
      </select>
    </div>
    <div id="jobList"></div>
    <div id="pagination" class="pagination"></div>
  </main>
</div>

<div id="modal" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const JOB_TYPE_LABELS = { fulltime: '正社員', contract: '契約社員', parttime: 'パート/アルバイト' };

let currentPage = 1;
const LIMIT = 10;

document.getElementById('salary').addEventListener('input', function() {
  const v = parseInt(this.value);
  document.getElementById('salaryDisplay').textContent = v === 0 ? '下限なし' : `${v}万円以上`;
});

document.getElementById('keyword').addEventListener('keydown', e => { if (e.key === 'Enter') search(1); });

function getFilters() {
  const jobTypes = [...document.querySelectorAll('.checkbox-group input:checked')].map(el => el.value);
  return {
    keyword: document.getElementById('keyword').value,
    location: document.getElementById('location').value,
    jobType: jobTypes.join(','),
    minSalary: document.getElementById('salary').value,
    experience: document.getElementById('experience').value,
    sort: document.getElementById('sortSelect').value,
  };
}

function applyHeaderSearch() {
  const kw = document.getElementById('headerKeyword').value;
  document.getElementById('keyword').value = kw;
  search(1);
}

function resetFilters() {
  document.getElementById('keyword').value = '';
  document.getElementById('location').value = '';
  document.getElementById('salary').value = 0;
  document.getElementById('salaryDisplay').textContent = '下限なし';
  document.getElementById('experience').value = '0';
  document.querySelectorAll('.checkbox-group input').forEach(el => el.checked = false);
  document.getElementById('headerKeyword').value = '';
  search(1);
}

async function search(page) {
  currentPage = page;
  const filters = getFilters();
  const params = new URLSearchParams({ ...filters, page, limit: LIMIT });
  document.getElementById('jobList').innerHTML = '<div class="spinner"></div>';
  document.getElementById('pagination').innerHTML = '';
  document.getElementById('resultsCount').innerHTML = '';

  try {
    const res = await fetch(`/api/jobs?${params}`);
    const data = await res.json();
    renderJobs(data);
  } catch (e) {
    document.getElementById('jobList').innerHTML = '<div class="empty"><p>エラーが発生しました。再度お試しください。</p></div>';
  }
}

function renderJobs({ jobs, total, page, limit }) {
  const list = document.getElementById('jobList');
  const countEl = document.getElementById('resultsCount');

  if (jobs.length === 0) {
    list.innerHTML = `<div class="empty">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="#aaa"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <p>条件に一致する求人が見つかりませんでした。<br>条件を変えて再度お試しください。</p>
    </div>`;
    countEl.innerHTML = '<strong>0</strong> 件の求人が見つかりました';
    return;
  }

  countEl.innerHTML = `<strong>${total}</strong> 件の求人が見つかりました`;

  list.innerHTML = jobs.map(job => `
    <div class="job-card" onclick="showDetail(${job.id})">
      <div class="job-title">${job.title}</div>
      <div class="job-company">${job.company}</div>
      <div class="job-meta">
        <span class="badge badge-location">📍 ${job.location}</span>
        <span class="badge badge-type">${JOB_TYPE_LABELS[job.jobType] || job.jobType}</span>
        <span class="badge badge-salary">💴 ${job.salary}〜${job.salaryMax}万円</span>
        <span class="badge badge-exp">経験 ${job.experience === 0 ? '不問' : job.experience + '年以上'}</span>
      </div>
      <div class="job-desc">${job.description}</div>
      <div class="job-tags">${job.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="job-card-footer">
        <button class="btn-detail" onclick="event.stopPropagation(); showDetail(${job.id})">詳細を見る →</button>
      </div>
    </div>
  `).join('');

  renderPagination(total, page, limit);
}

function renderPagination(total, page, limit) {
  const totalPages = Math.ceil(total / limit);
  if (totalPages <= 1) return;

  const pag = document.getElementById('pagination');
  let html = `<button ${page === 1 ? 'disabled' : ''} onclick="search(${page - 1})">‹ 前へ</button>`;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
      html += `<button class="${i === page ? 'active' : ''}" onclick="search(${i})">${i}</button>`;
    } else if (Math.abs(i - page) === 3) {
      html += `<button disabled>…</button>`;
    }
  }

  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="search(${page + 1})">次へ ›</button>`;
  pag.innerHTML = html;
}

async function showDetail(id) {
  const res = await fetch(`/api/jobs/${id}`);
  const job = await res.json();
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>${job.title}</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-company">🏢 ${job.company}</div>
      <div class="modal-meta">
        <span class="badge badge-location">📍 ${job.location}</span>
        <span class="badge badge-type">${JOB_TYPE_LABELS[job.jobType] || job.jobType}</span>
        <span class="badge badge-salary">💴 ${job.salary}〜${job.salaryMax}万円</span>
        <span class="badge badge-exp">経験 ${job.experience === 0 ? '不問' : job.experience + '年以上'}</span>
      </div>
      <div class="modal-desc">${job.description}</div>
      <div class="modal-tags">${job.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <button class="btn-apply" onclick="alert('実際のサービスでは応募ページに遷移します')">この求人に応募する</button>
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(event) {
  if (!event || event.target === document.getElementById('modal')) {
    document.getElementById('modal').style.display = 'none';
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

search(1);
</script>
</body>
</html>
